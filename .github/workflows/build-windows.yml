# Builds Trail-Setup.exe on GitHub's Windows machines.
#
# • Every push to main: builds a test installer (Actions tab → run → "Trail-Setup" artifact).
# • Publishing a GitHub Release (tag like v1.2.0): builds with that version number and
#   attaches Trail-Setup.exe to the release. The website's Download button and the
#   in-app updater both pick it up automatically.
name: Build Windows installer

on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "*.md", "supabase/**"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build
        shell: pwsh
        env:
          TRAIL_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Trail-Setup
          path: dist/Trail-Setup.exe
      - name: Attach installer to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/Trail-Setup.exe --clobber
