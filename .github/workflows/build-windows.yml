# Builds Trail-Setup.exe on GitHub's Windows machines.
# Push this project to a GitHub repo, then open Actions → "Build Windows installer"
# → latest run → download the "Trail-Setup" artifact.
# Pushing a tag like v1.0.0 also attaches the installer to a GitHub Release.
name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Trail-Setup
          path: dist/Trail-Setup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Trail-Setup.exe
